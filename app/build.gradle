plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.sangit.androidagent'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.sangit.androidagent'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // No signing secrets in source control. Configure signing separately.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
