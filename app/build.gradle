plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.sangit.androidagent'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.sangit.androidagent'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.3.6'
    }

    buildTypes {
        // Side-by-side debug package: protects data from a previously installed
        // debug APK signed with an unrelated ephemeral GitHub Actions key.
        // Production package identity is left unchanged.
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
        }
        release {
            minifyEnabled false
            // No signing secrets in source control. Configure signing separately.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
