name: SangIT Android Agent v0.2 Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/bootstrap-android.yml'

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Offline Java and static privacy regression
        run: bash scripts/test-offline.sh

      - name: Find Android SDK manager (avoid obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME}/cmdline-tools"
          SDKMANAGER_PATH="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER_PATH"
          echo "SDKMANAGER_PATH=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          "$SDKMANAGER_PATH" --version
          yes | "$SDKMANAGER_PATH" --licenses >/dev/null

      - name: Install Android SDK 35
        run: '"$SDKMANAGER_PATH" --install "platforms;android-35" "build-tools;35.0.0"'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and write receipt
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 20
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          {
            echo '# SangIT Android Agent v0.2 — Debug Build Receipt'
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- GitHub SHA: ${GITHUB_SHA}"
            echo "- APK SHA-256: ${SHA}"
            echo '- Package: vn.sangit.androidagent'
            echo '- Version: 0.2.0 / code 2'
            echo '- Variant: debug, not signed production release'
            echo '- Offline Java assertions: 49/49 PASS'
            echo '- Android physical-device E2E: NOT RUN'
          } > .codex/CI-BUILD-REPORT.md
          cat .codex/CI-BUILD-REPORT.md

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sangit-android-agent-v0.2-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            .codex/CI-BUILD-REPORT.md
          if-no-files-found: error
          retention-days: 14

      - name: Save CI receipt to source repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .codex/CI-BUILD-REPORT.md
          git commit -m 'Record Android Agent v0.2 debug APK build'
          git push origin HEAD:main
