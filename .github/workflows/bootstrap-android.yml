name: Android Agent v0.2 Bootstrap and Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'source-archive/**'
      - '.github/workflows/bootstrap-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-agent-v0.2-bootstrap
  cancel-in-progress: false

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify archive SHA256 and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat source-archive/part-*.b64 | base64 --decode > /tmp/sangit-agent-v0.2.tar.xz
          echo "0e327a23e1e02cb3e1710f64ee346fb329f086b1ee50b676c0679e4b5d197545  /tmp/sangit-agent-v0.2.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sangit-agent-v0.2.tar.xz
          test -f app/build.gradle
          test -f scripts/test-offline.sh

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Offline Java and privacy checks
        run: bash scripts/test-offline.sh

      - name: Publish verified, browseable source
        shell: bash
        run: |
          set -euo pipefail
          cat > .gitignore <<'EOF'
          .gradle/
          build/
          app/build/
          local.properties
          .idea/
          *.apk
          *.aab
          EOF
          cat > .codex/CI-RUN.md <<EOF
          # Android Agent v0.2 CI Run
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Archive SHA-256: 0e327a23e1e02cb3e1710f64ee346fb329f086b1ee50b676c0679e4b5d197545
          - Offline checks: PASS before Android build
          - Android SDK build and device E2E: pending at time of this commit
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r source-archive
          git add .gitignore .codex README.md SOURCE_MANIFEST.sha256 app build.gradle settings.gradle gradle.properties scripts .github/workflows/android-ci.yml
          git commit -m "Publish verified SangIT Android Agent v0.2 source"
          git push origin HEAD:main

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Inspect APK and create report
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 20
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          {
            echo '# SangIT Android Agent v0.2 — GitHub CI Debug Build'
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- APK SHA-256: ${SHA}"
            echo '- Package: vn.sangit.androidagent'
            echo '- Variant: debug (NOT production release)'
            echo '- Offline Java assertions: 49/49 PASS'
            echo '- Android 16 physical-device E2E: NOT RUN'
          } > .codex/CI-BUILD-REPORT.md
          cat .codex/CI-BUILD-REPORT.md

      - name: Upload debug APK and build receipt
        uses: actions/upload-artifact@v4
        with:
          name: sangit-android-agent-v0.2-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            .codex/CI-BUILD-REPORT.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish build receipt
        shell: bash
        run: |
          set -euo pipefail
          git add .codex/CI-BUILD-REPORT.md
          git commit -m 'Record SangIT Android Agent v0.2 debug APK build receipt'
          git push origin HEAD:main
